<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status Card</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 360px;
        margin: 0;
        padding: 20px;
        background: #111827;
        color: #f9fafb;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        border: 1px solid #334155;
        border-left: 5px solid var(--tone-color, #60a5fa);
        border-radius: 12px;
        padding: 18px;
        background: #1e293b;
      }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0; color: #cbd5e1; line-height: 1.5; }
      .tone { margin-top: 14px; color: var(--tone-color, #60a5fa); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <article class="card">
      <h1 id="title">Status</h1>
      <p id="message">Waiting for status data.</p>
      <div class="tone" id="tone">info</div>
    </article>
    <script>
      const colors = {
        info: "#60a5fa",
        success: "#4ade80",
        warning: "#facc15",
        error: "#f87171"
      };

      window.addEventListener("turbocode-props", (event) => {
        const props = event.detail || {};
        const tone = colors[props.tone] ? props.tone : "info";
        document.querySelector("#title").textContent = String(props.title || "Status");
        document.querySelector("#message").textContent = String(props.message || "");
        document.querySelector("#tone").textContent = tone;
        document.querySelector(".card").style.setProperty("--tone-color", colors[tone]);
      });

      window.turbocode?.emit({ type: "ready" });
    </script>
  </body>
</html>
